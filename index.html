<title>Français Kartei</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
/* Layout: eine schmale Lernspalte wie ein Karteikasten, Navigation unten am Daumen */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E2E7E5; --ink:#14201E; --muted:#5B6866; --line:#D2DAD7;
  --accent:#0B6A8A; --accent-ink:#FFFFFF; --accent-soft:#D9ECF2; --saffron:#C98A0B;
  --again:#B9382A; --hard:#A86A12; --good:#277F4F; --easy:#0B6A8A;
  --display:"Fraunces","Atkinson Hyperlegible",Georgia,serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1314; --surface:#151E20; --sunk:#1C2729; --ink:#E4EAEA; --muted:#93A2A2; --line:#283537;
  --accent:#5CC4E0; --accent-ink:#0C1314; --accent-soft:#16343D; --saffron:#EDB43C;
  --again:#E26A5C; --hard:#DDA344; --good:#4DBE83; --easy:#5CC4E0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1314; --surface:#151E20; --sunk:#1C2729; --ink:#E4EAEA; --muted:#93A2A2; --line:#283537;
  --accent:#5CC4E0; --accent-ink:#0C1314; --accent-soft:#16343D; --saffron:#EDB43C;
  --again:#E26A5C; --hard:#DDA344; --good:#4DBE83; --easy:#5CC4E0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;min-height:100%}
header{display:flex;align-items:center;gap:10px}
header h1{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.01em}
header .star{width:26px;height:26px;color:var(--accent);flex:none}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.sync.on i{background:var(--good)}
.sync.busy i{background:var(--saffron)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today div{display:flex;flex-direction:column;gap:2px}
.today b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.today .n b{color:var(--accent)} .today .l b{color:var(--again)} .today .r b{color:var(--good)}
.today span{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-size:18px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.goal p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .s{background:var(--good)} .bar .le{background:var(--saffron)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.decks{display:flex;flex-direction:column;gap:12px}
.deck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.deck b{font-weight:700}
.deck small{color:var(--muted);font-variant-numeric:tabular-nums}
.deck .bar{grid-column:1/-1;height:6px}

/* Lernen */
.counts{display:flex;gap:14px;font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.counts .n{color:var(--accent)} .counts .l{color:var(--again)} .counts .r{color:var(--good)}
.counts .x{background:none;border:0;color:var(--muted);padding:6px 4px}
.counts .x:disabled{opacity:.35;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:340px;padding:40px 20px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
.card .cat{position:absolute;top:14px;left:16px}
.card .tag{position:absolute;top:12px;right:14px;font-size:12px;color:var(--muted);background:var(--sunk);border-radius:20px;padding:3px 10px}
.front{font-size:26px;font-weight:700;text-wrap:balance}
.front.big{font-family:var(--display);font-size:64px;line-height:1.1}
.hr{width:48px;height:2px;background:var(--line);margin:6px 0}
.frl{display:flex;align-items:center;justify-content:center;gap:8px;max-width:100%}
.fr{font-family:var(--display);font-size:32px;font-weight:700;color:var(--accent);text-wrap:balance;line-height:1.2}
.fr.long{font-size:25px}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;padding:0}
.say svg{width:22px;height:22px}
.say.on{background:var(--accent);color:var(--accent-ink)}
.aus{font-size:17px;color:var(--ink);letter-spacing:.02em}
.aus::before{content:"sprich  ";font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sub{font-size:16px;color:var(--muted);text-wrap:balance}
.tap{font-size:13px;color:var(--muted)}
.edit{position:absolute;bottom:10px;right:14px;background:none;border:0;color:var(--muted);font-size:13px;padding:6px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:0;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sunk);font-weight:700}
.grades button small{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grades .g1{color:var(--again)} .grades .g2{color:var(--hard)} .grades .g3{color:var(--good)} .grades .g4{color:var(--easy)}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 16px}
.done .star{width:56px;height:56px;color:var(--saffron)}
.done h2{font-family:var(--display);margin:0;font-size:26px}
.done p{margin:0;color:var(--muted);max-width:34ch}

/* Kartei */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .d{min-width:0}
.row .d b{font-weight:700;color:var(--accent)}
.row .d div{font-size:14px;color:var(--muted)}
.st{align-self:center;font-size:12px;border-radius:20px;padding:2px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.le{color:var(--hard)} .st.rv{color:var(--good)} .st.ok{background:var(--good);color:var(--surface)}
.more{padding:12px}

/* Einstellungen */
.set{display:flex;flex-direction:column;gap:14px}
.set h3{margin:0;font-size:16px}
.set p{margin:0;color:var(--muted);font-size:14px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--accent)}
.range b{font-family:var(--display);font-size:24px;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sl{display:flex;flex-direction:column;gap:6px}
.sl span{font-size:14px;font-weight:700}
select.voice{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.keys b{font-family:var(--display);color:var(--accent)}
.danger{color:var(--again)}

/* Sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet form{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-size:20px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink)}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .acts .btn.save{background:var(--accent);color:var(--accent-ink)}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{border:0;background:none;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.card.flip{animation:flip .18s ease-out}@keyframes flip{from{transform:scale(.985);opacity:.7}to{transform:none;opacity:1}}}
</style>

</head><body>

function dayKey(ts){ const d = new Date(ts - 4*3600000); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayStart(ts){ const d = new Date(ts - 4*3600000); d.setHours(4,0,0,0); return d.getTime(); }
function rollDay(){ const k = dayKey(Date.now()); if (S.day.d !== k) S.day = {d:k, n:0, r:0}; }

let CARDS = [], BYID = {};
function buildCards(){
  const custom = (S.cu||[]).map(x => Object.assign({k:"wort", c:"Eigene"}, x));
  CARDS = [].concat(BASE.filter(c=>c.k!=="wort"), custom, BASE.filter(c=>c.k==="wort"));
  BYID = {};
  CARDS.forEach(c => BYID[c.id] = c);
}
function view(c){ const e = S.ed[c.id]; return e ? Object.assign({}, c, e) : c; }

/* ---------- Wiederholungs-Logik (angelehnt an Anki) ---------- */
function schedule(prev, g, now){
  let [s, due, ivl, ease, reps, lapses, step] = prev ? prev.slice() : [0,0,0,2.5,0,0,0];
  const today = dayStart(now);
  if (s === 0 || s === 1 || s === 3){
    const steps = s === 3 ? RELEARN : STEPS;
    const was = s; if (s === 0) s = 1;
    if (g === 1){ step = 0; due = now + steps[0]*MIN; }
    else if (g === 2){ due = now + Math.round(steps[Math.min(step,steps.length-1)]*1.5)*MIN; }
    else if (g === 3){
      step++;
      if (step >= steps.length){ s = 2; step = 0; ivl = was === 3 ? Math.max(1, ivl) : 1; due = today + ivl*DAY; }
      else due = now + steps[step]*MIN;
    } else { s = 2; step = 0; ivl = was === 3 ? Math.max(1, ivl) + 1 : 4; due = today + ivl*DAY; }
  } else {
    if (g === 1){ lapses++; ease = Math.max(1.3, ease - .2); ivl = Math.max(1, Math.round(ivl*.3)); s = 3; step = 0; due = now + RELEARN[0]*MIN; }
    else {
      if (g === 2){ ivl = Math.max(ivl+1, Math.round(ivl*1.2)); ease = Math.max(1.3, ease - .15); }
      if (g === 3){ ivl = Math.max(ivl+1, Math.round(ivl*ease)); }
      if (g === 4){ ivl = Math.max(ivl+2, Math.round(ivl*ease*1.3)); ease += .15; }
      ivl = Math.min(ivl, 365); due = today + ivl*DAY;
    }
  }
  return [s, due, ivl, Math.round(ease*100)/100, reps+1, lapses, step];
}
function fmt(ms){
  const m = Math.round(ms/MIN);
  if (m < 60) return "<" + Math.max(1,m) + " Min";
  const d = Math.round(ms/DAY);
  if (d < 1) return Math.round(m/60) + " Std";
  if (d === 1) return "1 Tag";
  if (d < 30) return d + " Tage";
  if (d < 365) return Math.round(d/30) + " Mon";
  return "1 Jahr";
}

/* ---------- Warteschlange ---------- */
let altToggle = false;
function stats(now){
  let learn=0, review=0, newLeft = Math.max(0, S.set.np - S.day.n), nw=0, seen=0, solid=0;
  for (const c of CARDS){
    const x = S.c[c.id];
    if (!x){ nw++; continue; }
    seen++;
    if ((x[0]===1||x[0]===3) && x[1] <= now) learn++;
    else if (x[0]===2 && x[1] <= now) review++;
    if (x[0]===2 && x[2] >= 21) solid++;
  }
  return {learn, review, newToday: Math.min(newLeft, nw), nw, seen, solid};
}
function nextCard(now, avoid){
  let lBest=null, rBest=null, ahead=null;
  for (const c of CARDS){
    const x = S.c[c.id]; if (!x || c.id===avoid) continue;
    if (x[0]===1||x[0]===3){
      if (x[1] <= now){ if (!lBest || x[1] < S.c[lBest.id][1]) lBest = c; }
      else if (x[1] <= now + 20*MIN){ if (!ahead || x[1] < S.c[ahead.id][1]) ahead = c; }
    } else if (x[0]===2 && x[1] <= now){ if (!rBest || x[1] < S.c[rBest.id][1]) rBest = c; }
  }
  if (lBest) return lBest;
  const nw = S.day.n < S.set.np ? CARDS.find(c => !S.c[c.id]) : null;
  if (rBest && nw){ altToggle = !altToggle; return altToggle ? rBest : nw; }
  if (rBest || nw) return rBest || nw;
  if (ahead) return ahead;
  if (avoid){ const x = S.c[avoid]; if (x && (x[0]===1||x[0]===3) && x[1] <= now + 20*MIN) return BYID[avoid]; }
  return null;
}

/* ---------- Sprachausgabe (Stimmen des Geräts, fr-FR) ---------- */
const TTS = {ok: typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined", voices: []};
function loadVoices(){
  if (!TTS.ok) return;
  try {
    TTS.voices = speechSynthesis.getVoices().filter(v => /^fr([-_]|$)/i.test(v.lang))
      .sort((a,b) => (rankVoice(b) - rankVoice(a)) || a.name.localeCompare(b.name));
  } catch(e){ TTS.voices = []; }
}
function rankVoice(v){ const l = v.lang.replace("_","-").toLowerCase(); return (l === "fr-fr" ? 2 : 0) + (v.localService ? 1 : 0); }
function pickVoice(){ return TTS.voices.find(v => v.voiceURI === S.set.voice) || TTS.voices[0] || null; }
function speechText(t){
  return String(t||"")
    .replace(/\((m|f|pl)\)/gi, " ")
    .replace(/\(([^)]*)\)/g, ", $1")
    .replace(/\.\.\.|…/g, " ")
    .replace(/\s*\/\s*/g, ", ")
    .replace(/\s+([?!])/g, "$1")
    .replace(/\s+,/g, ",").replace(/,\s*,/g, ",")
    .replace(/\s+/g, " ").replace(/^[,\s]+|[,\s]+$/g, "").trim();
}
function speak(text, btn){
  if (!TTS.ok){ toast("Sprachausgabe wird hier nicht unterstützt"); return; }
  const s = speechText(text); if (!s) return;
  if (!TTS.voices.length) loadVoices();
  const u = new SpeechSynthesisUtterance(s);
  u.lang = "fr-FR";
  const v = pickVoice(); if (v){ u.voice = v; u.lang = v.lang; }
  u.rate = S.set.slow ? 0.7 : 1;
  if (btn){ btn.classList.add("on"); const off = () => btn.classList.remove("on"); u.onend = off; u.onerror = off; }
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(() => speechSynthesis.speak(u), 60); }
    else speechSynthesis.speak(u);
  } catch(e){ toast("Vorlesen hat nicht geklappt"); }
}
function stopSpeech(){ try { if (TTS.ok) speechSynthesis.cancel(); } catch(e){} }
if (TTS.ok){
  loadVoices();
  try { speechSynthesis.addEventListener("voiceschanged", () => { loadVoices(); if (tab === "setup") renderSetup(); }); } catch(e){}
}
const sayBtn = t => `<button class="say" data-say="${esc(t)}" aria-label="Vorlesen" type="button"><svg><use href="#hp"/></svg></button>`;

/* ---------- Speichern (offline, auf dem Gerät) ---------- */
function touch(){
  S.t = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); setSync("ok"); } catch(e){ setSync("err"); }
}
function setSync(m){
  const el = document.getElementById("sync");
  el.className = "sync " + (m==="ok"?"on":"");
  el.querySelector("span").textContent = m==="ok" ? "Gespeichert" : m==="err" ? "Speichern fehlgeschlagen" : "Offline bereit";
}
function lastBackupText(){
  if (!S.bk) return "Noch keine Sicherung gemacht.";
  const d = Math.floor((Date.now()-S.bk)/DAY);
  return "Letzte Sicherung: " + (d<1 ? "heute" : d===1 ? "gestern" : "vor " + d + " Tagen") + ".";
}
async function exportBackup(){
  S.bk = Date.now(); touch();
  const d = new Date(), stamp = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const name = "francais-sicherung-" + stamp + ".json";
  const blob = new Blob([JSON.stringify(S)], {type:"application/json"});
  try {
    const file = new File([blob], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Français Sicherung"}); toast("Sicherung bereit"); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1000);
  toast("Sicherung gespeichert");
}
function isOwnBackup(data){
  if (!data || typeof data.c !== "object" || data.c === null) return false;
  if (data.app) return data.app === APP;
  // ältere Dateien ohne Kennung: nur akzeptieren, wenn keine fremden Karten-IDs drin sind
  return Object.keys(data.c).every(k => /^(z|f|u)/.test(k));
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data.c !== "object") throw 0;
      if (!isOwnBackup(data)){ toast("Das ist eine Sicherung einer anderen App (z. B. Darija), nicht geladen"); return; }
      S = load(data); buildCards(); rollDay(); touch(); study = null;
      toast("Sicherung geladen: " + Object.keys(S.c).length + " Karten mit Lernstand"); render();
    } catch(e){ toast("Das ist keine gültige Sicherungsdatei"); }
  };
  r.readAsText(file);
}
function connect(){
  setSync("ok");
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js", {scope:"./"}).catch(()=>{});
}

/* ---------- Oberfläche ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let tab = "lernen", study = null; // study = {card, shown, front}
function toast(t){ const el = document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2200); }

function render(){
  rollDay();
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "lernen") study ? renderStudy() : renderHome();
  else if (tab === "kartei") renderList();
  else renderSetup();
}

function daysLeft(){ return Math.max(1, Math.ceil((GOAL - dayStart(Date.now())) / DAY)); }

function renderHome(){
  const now = Date.now(), s = stats(now);
  const total = CARDS.length, learning = s.seen - s.solid;
  const rec = Math.ceil(s.nw / daysLeft());
  const due = s.learn + s.review + s.newToday;
  const deck = (k, name) => {
    const cs = CARDS.filter(c => c.k===k);
    const seen = cs.filter(c => S.c[c.id]).length, solid = cs.filter(c => S.c[c.id] && S.c[c.id][0]===2 && S.c[c.id][2]>=21).length;
    return `<div class="deck"><b>${name}</b><small>${seen} / ${cs.length} gesehen</small>
      <div class="bar"><i class="s" style="width:${solid/cs.length*100}%"></i><i class="le" style="width:${(seen-solid)/cs.length*100}%"></i></div></div>`;
  };
  $("#view").innerHTML = `
  <section class="panel" style="display:flex;flex-direction:column;gap:16px">
    <div class="lbl">Heute</div>
    <div class="today">
      <div class="n"><b>${s.newToday}</b><span>neu</span></div>
      <div class="l"><b>${s.learn}</b><span>am Lernen</span></div>
      <div class="r"><b>${s.review}</b><span>Wiederholung</span></div>
    </div>
    <button class="btn primary" id="go">${due ? "Lernen starten" : "Für heute fertig"}</button>
  </section>
  ${Object.keys(S.c).length >= 30 && (!S.bk || Date.now()-S.bk > 7*DAY) ? `<section class="panel" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span style="font-size:14px">${S.bk ? "Deine letzte Sicherung ist über eine Woche alt." : "Du hast noch keine Sicherung deines Lernstands."}</span><button class="btn" id="bk-home">Jetzt sichern</button></section>` : ""}
  <section class="panel goal">
    <div class="lbl">Ziel 1. Dezember</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0 10px"><b style="font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums">${s.seen}</b><span style="color:var(--muted)">von ${total} Karten gesehen</span></div>
    <div class="bar"><i class="s" style="width:${s.solid/total*100}%"></i><i class="le" style="width:${learning/total*100}%"></i></div>
    <div class="legend"><span style="--c:var(--good)">sitzt (${s.solid})</span><span style="--c:var(--saffron)">im Aufbau (${learning})</span><span style="--c:var(--sunk)">neu (${s.nw})</span></div>
    <p>${s.nw ? `Noch ${daysLeft()} Tage. Für alle Karten bis dahin brauchst du etwa <b>${rec} neue pro Tag</b>, eingestellt sind ${S.set.np}.` : "Alle Karten sind eingeführt. Jetzt nur noch wiederholen."}</p>
  </section>
  <section class="panel decks">
    <div class="lbl">Stapel in Lernreihenfolge</div>
    ${deck("num","1 · Zahlen")}${deck("wort","2 · Wörter und Sätze nach Wichtigkeit")}
  </section>`;
  if ($("#bk-home")) $("#bk-home").onclick = exportBackup;
  $("#go").onclick = () => {
    const c = nextCard(Date.now());
    if (!c){ toast("Für heute ist alles erledigt"); return; }
    startCard(c); render();
  };
}

function startCard(c){
  const d = S.set.dir;
  study = {card:c, shown:false, front: d==="mix" ? (Math.random()<.5?"de":"fr") : d};
}

function cardFace(c, shown, front){
  const v = view(c);
  const frRow = `<div class="frl"><div class="fr${v.fr.length > 26 ? " long" : ""}" lang="fr">${esc(v.fr)}</div>${sayBtn(v.fr)}</div>`;
  const aus = v.aus ? `<div class="aus">${esc(v.aus)}</div>` : "";
  const big = c.k === "num" && front === "de";
  if (front === "de"){
    const f = `<div class="front${big?" big":""}">${esc(v.de)}</div>`;
    return shown ? `${f}<div class="hr"></div>${frRow}${aus}` : f;
  }
  return shown ? `${frRow}${aus}<div class="hr"></div><div class="front${c.k==="num"?" big":""}">${esc(v.de)}</div>` : `${frRow}${aus}`;
}

function setShown(val){
  const was = study.shown;
  study.shown = val;
  renderStudy();
  if (val && !was && S.set.auto){ const b = document.querySelector("#card .say"); speak(view(study.card).fr, b); }
  if (!val) stopSpeech();
}

function renderStudy(){
  const now = Date.now(), s = stats(now), c = study.card, x = S.c[c.id];
  const tag = !x ? "neu" : (x[0]===2 ? "Wiederholung" : "am Lernen");
  let grades = "";
  if (study.shown){
    const names = ["Nochmal","Schwer","Gut","Leicht"];
    grades = `<div class="grades">${[1,2,3,4].map(g => {
      const nx = schedule(x, g, now);
      return `<button class="g${g}" data-g="${g}">${names[g-1]}<small>${fmt(nx[1]-now)}</small></button>`;
    }).join("")}</div>`;
  }
  $("#view").innerHTML = `
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="counts"><span class="n">${s.newToday} neu</span><span class="l">${s.learn} lernen</span><span class="r">${s.review} fällig</span><button class="x" id="undo" ${hist.length?"":"disabled"} style="margin-left:auto">↶ Zurück</button><button class="x" id="stop" style="margin-left:0">Pause</button></div>
    <div class="card flip" id="card" role="button" tabindex="0" aria-label="${study.shown?"Karte":"Antwort zeigen"}">
      <span class="lbl cat">${esc(view(c).c)}</span><span class="tag">${tag}</span>
      ${cardFace(c, study.shown, study.front)}
      ${study.shown ? `<button class="edit" id="edit">Korrigieren</button>` : `<div class="tap">Tippen zum Aufdecken</div>`}
    </div>
    ${study.shown ? grades : `<button class="btn primary" id="show">Antwort zeigen</button>`}
  </div>`;
  $("#card").onclick = e => {
    const sb = e.target.closest(".say");
    if (sb){ e.stopPropagation(); speak(sb.dataset.say, sb); return; }
    if (e.target.closest("#edit")) return;
    setShown(!study.shown);
  };
  if ($("#show")) $("#show").onclick = () => { if (!study.shown) setShown(true); };
  $("#undo").onclick = undo;
  if ($("#edit")) $("#edit").onclick = e => { e.stopPropagation(); openEdit(c.id); };
  $("#stop").onclick = () => { stopSpeech(); study = null; render(); };
  document.querySelectorAll(".grades button").forEach(b => b.onclick = () => grade(+b.dataset.g));
}

const hist = [];
function undo(){
  const h = hist.pop(); if (!h) return;
  if (h.prev) S.c[h.id] = h.prev; else { delete S.c[h.id]; S.day.n = Math.max(0, S.day.n - 1); }
  S.day.r = Math.max(0, S.day.r - 1);
  touch();
  study = {card: BYID[h.id], shown: true, front: h.front};
  tab = "lernen"; render();
  toast("Bewertung zurückgenommen");
}
function grade(g){
  stopSpeech();
  const now = Date.now(), c = study.card, prev = S.c[c.id];
  hist.push({id: c.id, prev: prev ? prev.slice() : null, front: study.front});
  if (hist.length > 30) hist.shift();
  if (!prev) S.day.n++;
  S.c[c.id] = schedule(prev, g, now);
  S.day.r++;
  touch();
  const nx = nextCard(Date.now(), c.id);
  if (nx) startCard(nx);
  else study = null;
  if (study){ renderStudy(); return; }
  $("#view").innerHTML = `<div class="done panel"><svg class="star"><use href="#bulle"/></svg><h2>C'est fini, bravo !</h2><p>Für heute ist alles geschafft. Neue Wiederholungen kommen morgen. Probier die Sätze heute an der Uni oder beim Einkaufen aus.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" id="undo2">↶ Letzte Bewertung zurück</button><button class="btn" id="back">Zur Übersicht</button></div></div>`;
  $("#back").onclick = render;
  $("#undo2").onclick = undo;
}

document.addEventListener("keydown", e => {
  if (tab !== "lernen" || !study || document.querySelector(".sheet")) return;
  if (e.key === " " || e.key === "Enter"){ e.preventDefault(); setShown(!study.shown); }
  else if (study.shown && "1234".includes(e.key)) grade(+e.key);
  else if (e.key === "z" || e.key === "Backspace") undo();
  else if (e.key === "v"){ const b = document.querySelector("#card .say"); if (b) speak(b.dataset.say, b); }
});

/* Kartei-Liste */
let q = "", filt = "alle", limit = 150;
function status(id){
  const x = S.c[id];
  if (!x) return ["neu",""];
  if (x[0]!==2) return ["lernt","le"];
  if (x[2] >= 21) return ["sitzt","ok"];
  return [fmt(x[2]*DAY), "rv"];
}
function fold(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function renderList(){
  const nq = fold(q);
  const items = CARDS.filter(c => {
    const st = status(c.id)[0];
    if (filt==="neu" && st!=="neu") return false;
    if (filt==="lernt" && (st==="neu"||st==="sitzt")) return false;
    if (filt==="sitzt" && st!=="sitzt") return false;
    if (!nq) return true;
    const v = view(c);
    return fold(v.de).includes(nq) || fold(v.fr).includes(nq) || fold(v.c).includes(nq) || fold(v.aus).includes(nq);
  });
  const chip = (k,n) => `<button class="chip" data-f="${k}" aria-pressed="${filt===k}">${n}</button>`;
  $("#view").innerHTML = `
  <div style="display:flex;flex-direction:column;gap:12px">
    <input class="search" id="q" type="search" placeholder="Suchen: deutsch, französisch oder Thema" value="${esc(q)}" autocomplete="off">
    <div class="chips">${chip("alle","Alle")}${chip("neu","Neu")}${chip("lernt","Im Aufbau")}${chip("sitzt","Sitzt")}<button class="chip" id="add" style="margin-left:auto">+ Eigene Karte</button></div>
    <div class="lbl">${items.length} Karten</div>
    <div class="list">${items.slice(0,limit).map(c => { const v = view(c), [t,cl] = status(c.id);
      return `<button class="row" data-id="${c.id}"><span class="d"><span>${esc(v.de)}</span><div><b lang="fr">${esc(v.fr)}</b>${v.aus ? " · " + esc(v.aus) : ""}</div></span><span class="st ${cl}">${t}</span></button>`; }).join("") || `<div class="more">Nichts gefunden.</div>`}</div>
    ${items.length > limit ? `<button class="btn" id="more">Weitere ${Math.min(150, items.length-limit)} anzeigen</button>` : ""}
  </div>`;
  const qi = $("#q");
  qi.oninput = () => { q = qi.value; limit = 150; renderList(); const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  document.querySelectorAll(".chip[data-f]").forEach(b => b.onclick = () => { filt = b.dataset.f; limit = 150; renderList(); });
  document.querySelectorAll(".row").forEach(b => b.onclick = () => openEdit(b.dataset.id));
  $("#add").onclick = () => openEdit(null);
  if ($("#more")) $("#more").onclick = () => { limit += 150; renderList(); };
}

/* Bearbeiten / eigene Karte */
function openEdit(id){
  const c = id ? BYID[id] : null, v = c ? view(c) : {de:"",fr:"",aus:""};
  const isCustom = c && String(c.id).startsWith("u");
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<form id="ef">
    <h2>${c ? "Karte korrigieren" : "Eigene Karte"}</h2>
    <label for="e-de">Deutsch<input id="e-de" value="${esc(v.de)}" required></label>
    <label for="e-fr">Französisch (Nomen mit le, la, un, une)<input id="e-fr" value="${esc(v.fr)}" required autocapitalize="off" lang="fr"></label>
    <label for="e-aus">Aussprachehilfe (optional)<input id="e-aus" value="${esc(v.aus)}" autocapitalize="off"></label>
    <div class="acts">
      <button type="button" class="btn" id="e-say" style="margin-right:auto">▶ Anhören</button>
      ${c && S.ed[c.id] ? `<button type="button" class="btn" id="e-reset">Original</button>` : ""}
      ${isCustom ? `<button type="button" class="btn danger" id="e-del">Löschen</button>` : ""}
      <button type="button" class="btn" id="e-cancel">Abbrechen</button>
      <button type="submit" class="btn save">Speichern</button>
    </div></form>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.addEventListener("click", e => { if (e.target === el) close(); });
  el.querySelector("#e-cancel").onclick = close;
  el.querySelector("#e-say").onclick = () => speak(el.querySelector("#e-fr").value);
  const r = el.querySelector("#e-reset"); if (r) r.onclick = () => { delete S.ed[c.id]; touch(); close(); toast("Original wiederhergestellt"); render(); };
  const d = el.querySelector("#e-del"); if (d) d.onclick = () => { S.cu = S.cu.filter(x => x.id !== c.id); delete S.c[c.id]; delete S.ed[c.id]; buildCards(); touch(); close(); if (study && study.card.id===c.id) study=null; toast("Karte gelöscht"); render(); };
  el.querySelector("#ef").onsubmit = e => {
    e.preventDefault();
    const val = {de: el.querySelector("#e-de").value.trim(), fr: el.querySelector("#e-fr").value.trim(), aus: el.querySelector("#e-aus").value.trim()};
    if (!val.de || !val.fr) return;
    if (!c){ S.cu.push(Object.assign({id:"u"+Date.now().toString(36)}, val)); buildCards(); toast("Karte hinzugefügt, kommt als nächste neue Karte"); }
    else if (isCustom){ Object.assign(S.cu.find(x => x.id===c.id), val); buildCards(); toast("Gespeichert"); }
    else { S.ed[c.id] = val; toast("Korrektur gespeichert"); }
    touch(); close(); render();
  };
  setTimeout(() => el.querySelector("#e-de").focus(), 50);
}

/* Einstellungen */
let resetArmed = false;
function renderSetup(){
  const s = stats(Date.now()), rec = Math.ceil(s.nw / daysLeft());
  const seg = (v,n) => `<button data-d="${v}" aria-pressed="${S.set.dir===v}">${n}</button>`;
  const tog = (k,v,n) => `<button data-k="${k}" data-v="${v}" aria-pressed="${S.set[k]===v}">${n}</button>`;
  const cur = pickVoice();
  const voiceUi = !TTS.ok
    ? `<p>Dieser Browser kann nicht vorlesen.</p>`
    : TTS.voices.length
      ? `<label class="sl" for="voice"><span>Stimme</span><select class="voice" id="voice">${TTS.voices.map(v => `<option value="${esc(v.voiceURI)}" ${cur && cur.voiceURI===v.voiceURI ? "selected" : ""}>${esc(v.name)} (${esc(v.lang)})</option>`).join("")}</select></label>`
      : `<p>Keine französische Stimme gefunden. Auf dem iPhone: Einstellungen › Bedienungshilfen › Gesprochene Inhalte › Stimmen › Französisch. Danach die App neu öffnen.</p>`;
  $("#view").innerHTML = `
  <div class="set">
    <section class="panel set">
      <h3>Neue Karten pro Tag</h3>
      <div class="range"><input id="np" type="range" min="5" max="40" step="1" value="${S.set.np}" aria-label="Neue Karten pro Tag"><b id="npv">${S.set.np}</b></div>
      <p>Empfohlen für den 1. Dezember: ${rec} pro Tag. Jede neue Karte bringt in den folgenden Tagen mehrere Wiederholungen mit, rechne mit etwa 1 Minute pro neuer Karte.</p>
    </section>
    <section class="panel set">
      <h3>Was steht vorne auf der Karte?</h3>
      <div class="seg">${seg("de","Deutsch")}${seg("fr","Französisch")}${seg("mix","Gemischt")}</div>
      <p>Deutsch vorne trainiert das Sprechen, Französisch vorne das Verstehen.</p>
    </section>
    <section class="panel set">
      <h3>Vorlesen</h3>
      <div class="sl"><span>Beim Aufdecken automatisch vorlesen</span><div class="seg two">${tog("auto",true,"An")}${tog("auto",false,"Aus")}</div></div>
      <div class="sl"><span>Tempo</span><div class="seg two">${tog("slow",false,"Normal")}${tog("slow",true,"Langsam")}</div></div>
      ${voiceUi}
      ${TTS.ok ? `<button class="btn" id="probe">▶ Probe hören</button>` : ""}
      <p>Vorgelesen wird mit den Stimmen deines iPhones, das geht auch offline. Erweiterte Stimmen klingen deutlich natürlicher und lassen sich unter Gesprochene Inhalte › Stimmen laden. Auf jeder Karte kannst du außerdem den Lautsprecher antippen.</p>
    </section>
    <section class="panel set">
      <h3>So liest du die Aussprachehilfe</h3>
      <div class="keys">
        <b>ã</b><span>nasales a wie in „Restaurant“ (an, en)</span>
        <b>õ</b><span>nasales o wie in „Bonbon“ (on)</span>
        <b>ẽ</b><span>nasales ä wie in „Teint“ (in, ain, un)</span>
        <b>sch</b><span>wie in Schule (ch)</span>
        <b>sh</b><span>weiches sch wie in Garage (j, g vor e/i)</span>
        <b>z</b><span>weiches, summendes s wie in Sonne</span>
        <b>s</b><span>scharfes s wie in Haus</span>
        <b>ö</b><span>wie in „schön“ (eu, oft auch e)</span>
        <b>ü</b><span>wie in „Tür“ (u)</span>
        <b>u</b><span>wie in „gut“ (ou)</span>
        <b>w</b><span>wie englisch water (oi = wa)</span>
        <b>r</b><span>Zäpfchen-r, hinten im Hals</span>
      </div>
      <p>Die Aussprachehilfe steht nur bei Wörtern, die man nicht so liest, wie man sie schreibt. Endungen wie -e, -s, -t, -ent sind meist stumm. Am genauesten ist der Lautsprecher.</p>
      <p>Nomen stehen immer mit Artikel, damit du das Geschlecht mitlernst. Bei Wörtern mit l' steht un oder une, sonst sieht man es nicht. Verben stehen als Grundform mit der je-Form in Klammern, z. B. prendre (je prends).</p>
    </section>
    <section class="panel set">
      <h3>Sicherung</h3>
      <p>Dein Lernstand wird nach jeder Karte automatisch auf diesem Handy gespeichert, getrennt von der Darija-App. Löschst du das App-Symbol oder die Safari-Daten, ist er weg. Sichere ihn deshalb ab und zu in iCloud: „Sicherung speichern“, dann „In Dateien sichern“.</p>
      <p><b>${lastBackupText()}</b></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bk-out" style="background:var(--accent);color:var(--accent-ink)">Sicherung speichern</button><button class="btn" id="bk-in">Sicherung laden</button></div>
      <input type="file" id="bk-file" accept=".json,application/json" hidden>
    </section>
    <section class="panel set">
      <h3>Fortschritt zurücksetzen</h3>
      <p>Löscht alle Lernstände. Eigene Karten und Korrekturen bleiben.</p>
      <button class="btn danger" id="reset">${resetArmed ? "Wirklich alles zurücksetzen?" : "Zurücksetzen"}</button>
    </section>
  </div>`;
  $("#bk-out").onclick = exportBackup;
  $("#bk-in").onclick = () => $("#bk-file").click();
  $("#bk-file").onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ""; };
  const np = $("#np");
  np.oninput = () => { $("#npv").textContent = np.value; };
  np.onchange = () => { S.set.np = +np.value; touch(); };
  document.querySelectorAll(".seg button[data-d]").forEach(b => b.onclick = () => { S.set.dir = b.dataset.d; touch(); renderSetup(); });
  document.querySelectorAll(".seg button[data-k]").forEach(b => b.onclick = () => { S.set[b.dataset.k] = b.dataset.v === "true"; touch(); renderSetup(); });
  if ($("#voice")) $("#voice").onchange = e => { S.set.voice = e.target.value; touch(); speak("Bonjour, ça va ?"); };
  if ($("#probe")) $("#probe").onclick = () => speak("Bonjour ! Je suis étudiant en échange à Casablanca.");
  $("#reset").onclick = () => {
    if (!resetArmed){ resetArmed = true; renderSetup(); setTimeout(()=>{ if (resetArmed){ resetArmed=false; if (tab==="setup") renderSetup(); } }, 5000); return; }
    resetArmed = false; S.c = {}; S.day = {d:"",n:0,r:0}; touch(); toast("Fortschritt zurückgesetzt"); renderSetup();
  };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { stopSpeech(); tab = b.dataset.tab; render(); window.scrollTo(0,0); });

buildCards(); rollDay(); render(); connect();
</script>

</body></html>
